project_id = "gestao-fazenda"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

# Fase 2 — webhook do bot. import_map compartilhado permite que o código de
# src/domain e src/infra (também usado pelo Next.js) resolva o pacote "zod"
# sem precisar de um fork Deno-only desses arquivos.
[functions.bot-webhook]
verify_jwt = false
import_map = "./functions/import_map.json"

# Fase 6 — webhook do bot via WhatsApp Cloud API. verify_jwt=false porque a
# Meta chama este endpoint sem token de sessão Supabase — a autenticidade da
# chamada é garantida pelo handshake GET (hub.verify_token) e pela
# verificação HMAC do header X-Hub-Signature-256 no POST (feita no próprio
# handler, não pelo Supabase).
[functions.bot-webhook-whatsapp]
verify_jwt = false
import_map = "./functions/import_map.json"
